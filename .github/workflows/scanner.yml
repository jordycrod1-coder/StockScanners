name: Stock Scanners

on:
  schedule:
    - cron: '37 16 * * 1-5'   # 4:37 PM ET - primary run
      timezone: 'America/New_York'
    - cron: '47 17 * * 1-5'   # 5:47 PM ET - backup (skips itself if the primary succeeded)
      timezone: 'America/New_York'
  workflow_dispatch:

# Needed so this workflow can publish to GitHub Pages.
# actions: read lets the check job look up today's earlier runs.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Only one Pages deployment at a time; don't cancel one that's mid-flight.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Decides whether this run should do anything.
  # Manual runs always proceed; a scheduled run is skipped if a run
  # already succeeded today.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=America/New_York date +%F)
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w "${{ github.workflow }}" \
                --status success --created ">=$today" --json databaseId -q 'length')
          echo "Successful runs today: $n"
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  Scanner_All-Time-Highs:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run All-Time-High Scanner
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          ALERT_TO: jordycrod1@gmail.com
        run: python scanner_All-Time-High_1.py

  # Buy/sell email alerts from the multi-timeframe indicator scanner (TSLA).
  # Emails only when the buy and/or sell rule fires on today's close.
  Scanner_MTF-Buy-Sell-Signals:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run multi-timeframe buy/sell signal scanner
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          ALERT_TO: jordycrod1@gmail.com
          SIGNAL_TICKER: TSLA
        run: python mtf_signal_scanner.py --alert

  Dashboard:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      # --- Scanner sections (appear at the bottom of the dashboard) ---
      # Each one writes into site/scanners/<name>/. Add future scanners as
      # extra steps here, BEFORE "Generate S&P 500 dashboard".
      # continue-on-error: a failed scanner never blocks the dashboard publish.
      - name: Scanner section - All-Time-High backtest
        continue-on-error: true
        env:
          BACKTEST_OUTPUT_DIR: site/scanners/ath-backtest
          BACKTEST_HTML_NAME: index.html
          BACKTEST_PLOTLY_JS: cdn
        run: python ath_scanner_backtest.py

      - name: Scanner section - Multi-timeframe buy/sell signals backtest (TSLA)
        continue-on-error: true
        env:
          BACKTEST_OUTPUT_DIR: site/scanners/mtf-signals-backtest
          BACKTEST_HTML_NAME: index.html
          BACKTEST_PLOTLY_JS: cdn
          SIGNAL_TICKER: TSLA
        run: python mtf_signal_scanner.py

      - name: Generate S&P 500 dashboard
        run: python dashboard_sp500.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
