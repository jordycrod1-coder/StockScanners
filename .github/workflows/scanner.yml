name: Stock Scanners

on:
  schedule:
    - cron: '15 16 * * 1-5'   # 4:30 PM
      timezone: 'America/New_York'
  workflow_dispatch:

jobs:
  Scanner_All-Time-Highs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run All-Time-High Scanner
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          ALERT_TO: jordycrod1@gmail.com
        run: python scanner_All-Time-High_1.py
